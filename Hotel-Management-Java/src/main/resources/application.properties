spring.application.name=hotel-management
server.port=8080
server.servlet.session.timeout=60m

# JSP views live in WEB-INF so they can't be opened directly
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.mvc.ignore-default-model-on-redirect=true

# H2 file database, created automatically in the ./data folder
spring.datasource.url=jdbc:h2:file:./data/hoteldb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Hotel details shown in the sidebar and on invoices - change these
hotel.name=Utkal Residency
hotel.address=Add your hotel address here
hotel.phone=+91 00000 00000
hotel.gstin=GSTIN not set
hotel.gst-percent=12

# First-run admin password (username is admin). Override with the ADMIN_PASSWORD environment variable.
app.admin.password=${ADMIN_PASSWORD:admin123}
